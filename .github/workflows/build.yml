name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Build the production image with its source revision
        run: docker build --label "org.opencontainers.image.revision=$GITHUB_SHA" --tag pustka-site:ci .
      - name: Start production container
        run: docker run -d --name pustka-ci -p 127.0.0.1:3000:3000 -e DOCS_SYNC_ENABLED=false -v pustka-ci-data:/data pustka-site:ci
      - name: Smoke-test production container
        run: node scripts/smoke.mjs http://127.0.0.1:3000
      - name: Verify persistent shares after restart
        run: |
          docker restart pustka-ci
          node scripts/smoke.mjs http://127.0.0.1:3000 --persistence
      - name: Save the tested production image
        if: >-
          github.repository == 'pustka-sh/Site' && github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: docker save --output "$RUNNER_TEMP/pustka-site.tar" pustka-site:ci
      - name: Transfer the tested image to the publisher
        if: >-
          github.repository == 'pustka-sh/Site' && github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: pustka-site-image-${{ github.sha }}
          path: ${{ runner.temp }}/pustka-site.tar
          if-no-files-found: error
          compression-level: 1
          retention-days: 1
      - name: Container logs and cleanup
        if: always()
        run: |
          docker logs pustka-ci || true
          docker rm -f pustka-ci || true
          docker volume rm pustka-ci-data || true

  publish:
    name: Publish container image
    needs: build
    if: >-
      github.repository == 'pustka-sh/Site' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/pustka-sh/site
    steps:
      - name: Download this run's tested image
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: pustka-site-image-${{ github.sha }}
          path: image
      - name: Load and verify the exact tested image
        run: |
          docker load --input image/pustka-site.tar
          test "$(docker image inspect pustka-site:ci --format '{{.Os}}/{{.Architecture}}')" = 'linux/amd64'
          test "$(docker image inspect pustka-site:ci --format '{{index .Config.Labels "org.opencontainers.image.source"}}')" = 'https://github.com/pustka-sh/Site'
          test "$(docker image inspect pustka-site:ci --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$GITHUB_SHA"
      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish commit and latest tags
        run: |
          docker tag pustka-site:ci "$IMAGE:sha-$GITHUB_SHA"
          docker tag pustka-site:ci "$IMAGE:latest"
          push_image() {
            if ! docker push "$1"; then
              printf '::notice::Image push failed; retrying the same image once.\n'
              sleep 5
              docker push "$1"
            fi
          }
          push_image "$IMAGE:sha-$GITHUB_SHA"
          push_image "$IMAGE:latest"
          digest="$(docker buildx imagetools inspect "$IMAGE:sha-$GITHUB_SHA" --format '{{.Manifest.Digest}}')"
          latest_digest="$(docker buildx imagetools inspect "$IMAGE:latest" --format '{{.Manifest.Digest}}')"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          test "$digest" = "$latest_digest"
          reference="$IMAGE@$digest"
          {
            printf '### Published website image\n\n'
            printf -- '- Latest: `%s:latest`\n' "$IMAGE"
            printf -- '- Commit: `%s:sha-%s`\n' "$IMAGE" "$GITHUB_SHA"
            printf -- '- Exact digest: `%s`\n' "$reference"
            printf -- '- Platform: `linux/amd64`\n\n'
            printf '[Package settings](https://github.com/orgs/pustka-sh/packages/container/site/settings)\n\n'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Check whether anonymous pulls are enabled
        run: |
          anonymous_config="$RUNNER_TEMP/pustka-anonymous-registry-check"
          mkdir -p "$anonymous_config"
          if docker --config "$anonymous_config" manifest inspect "$IMAGE:sha-$GITHUB_SHA" > /dev/null 2>&1; then
            printf 'Anonymous image downloads are available.\n' >> "$GITHUB_STEP_SUMMARY"
          else
            printf 'The image was published, but anonymous downloads could not be verified. GitHub initially creates packages as private. Set this package to Public in its settings for unauthenticated Proxmox pulls, then verify an unauthenticated pull.\n' >> "$GITHUB_STEP_SUMMARY"
          fi
