# Run from the existing Site directory to retain its Compose project and data volume.
services:
  site:
    image: ${SITE_IMAGE:-ghcr.io/pustka-sh/site:latest}
    pull_policy: always
    restart: unless-stopped
    init: true
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HOST_PORT:-3000}:3000"
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: 3000
      DATA_DIR: /data
    volumes:
      - site-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 768m
    pids_limit: 160
    stop_grace_period: 15s

volumes:
  site-data:
